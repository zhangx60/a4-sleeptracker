<ion-content>
  <main class="journal-page home">
    <header class="sky">
      <div>
        <h1>Sleep Tracker</h1>
      </div>
      <ion-icon name="moon" aria-hidden="true"></ion-icon>
    </header>

    <div class="overview">
      <section class="journal-card">
        <h2><ion-icon name="moon" aria-hidden="true"></ion-icon>{{ lastNightLabel }}</h2>
        @if (lastNight; as sleep) {
          <p class="total">{{ sleep.summaryString() }}</p>
          <p>{{ sleep.dateString() }}<br>{{ sleep.timeRangeString() }}</p>
          @if (sleep.quality) {
            <p>Sleep quality <strong>{{ sleep.quality }}</strong></p>
          }
        } @else {
          <p>No sleep logged yet.</p>
        }
        <ion-button expand="block" routerLink="/log-sleep">Log Sleep</ion-button>
      </section>

    </div>
    <ion-button expand="block" fill="outline" routerLink="/log-sleepiness">
      <ion-icon slot="start" name="sunny-outline" aria-hidden="true"></ion-icon>
      Log Sleepiness
    </ion-button>

    <ion-button class="history-link" expand="block" fill="clear" routerLink="/history">
      <ion-icon slot="start" name="time-outline" aria-hidden="true"></ion-icon>
      View History
    </ion-button>
  </main>
</ion-content>
