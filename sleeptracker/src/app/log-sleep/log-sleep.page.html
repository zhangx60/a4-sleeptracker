<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Log Sleep</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="journal-page">
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime id="bedtime" presentation="date-time" locale="en-US" [(ngModel)]="bedtime"
          [max]="maxTime" [showDefaultButtons]="true"></ion-datetime>
      </ng-template>
    </ion-modal>
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime id="waketime" presentation="date-time" locale="en-US" [(ngModel)]="wakeTime"
          [max]="maxTime" [showDefaultButtons]="true"></ion-datetime>
      </ng-template>
    </ion-modal>

    <h1>When did you sleep?</h1>
    <ion-list class="time-list">
      <ion-item lines="none">
        <ion-label>Bedtime</ion-label>
        <ion-datetime-button datetime="bedtime" slot="end"></ion-datetime-button>
      </ion-item>
      <ion-item lines="none">
        <ion-label>Wake-up Time</ion-label>
        <ion-datetime-button datetime="waketime" slot="end"></ion-datetime-button>
      </ion-item>
    </ion-list>

    @if (errorMessage) {
      <p role="alert"><ion-note color="danger">{{ errorMessage }}</ion-note></p>
    } @else {
      <p class="duration"><span>Sleep duration</span><strong>{{ durationText }}</strong></p>
    }
    <ion-button expand="block" [disabled]="!!errorMessage || isSaving" (click)="saveSleep()">
      {{ isSaving ? 'Saving…' : 'Continue' }}
    </ion-button>
  </main>
</ion-content>
